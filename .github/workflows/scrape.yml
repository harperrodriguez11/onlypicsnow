name: Scrape recipes

on:
  workflow_dispatch:        # Run manually: Actions tab -> "Scrape recipes" -> Run workflow
    inputs:
      main_url:
        description: "Main page URL to start from"
        required: true
        default: "https://foodiesposts.com/page1/"
        type: string
      max_links:
        description: "Maximum number of recipe links to scrape"
        required: false
        default: "10"
        type: string
  # schedule:               # Optional: uncomment to run daily (uses the defaults in the script)
  #   - cron: "0 3 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-scraper-v1

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install tools (in parallel)
        run: |
          # rclone installs in the background while pip runs
          (curl -fsSL https://rclone.org/install.sh | sudo bash > /tmp/rclone-install.log 2>&1) &
          RCLONE_PID=$!

          pip install requests beautifulsoup4 openpyxl playwright nest_asyncio

          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

          wait $RCLONE_PID || { cat /tmp/rclone-install.log; exit 1; }

      - name: Configure rclone for MEGA
        run: |
          mkdir -p ~/.config/rclone
          printf '[mega]\ntype = mega\nuser = %s\npass = %s\n' "${{ secrets.MEGA_USER }}" "${{ secrets.MEGA_PASS }}" > ~/.config/rclone/rclone.conf

      - name: Run scraper
        env:
          MAIN_URL: ${{ inputs.main_url }}
          MAX_LINKS: ${{ inputs.max_links }}
        run: python scraper.py

      - name: Keep a copy of the results on GitHub too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipes-output
          path: |
            recipes.xlsx
            images/
          if-no-files-found: ignore
          compression-level: 1
