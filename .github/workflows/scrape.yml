name: Scrape recipes

on:
  workflow_dispatch:        # Run manually: Actions tab -> "Scrape recipes" -> Run workflow
    inputs:
      main_url:
        description: "Main page URL to start from"
        required: true
        default: "https://foodiesposts.com/page1/"
        type: string
      max_links:
        description: "Maximum number of recipe links to scrape"
        required: false
        default: "10"
        type: string
  # schedule:               # Optional: uncomment to run daily (uses the defaults in the script)
  #   - cron: "0 3 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install requests beautifulsoup4 openpyxl playwright nest_asyncio

      - name: Install Chromium for the browser fallback
        run: playwright install --with-deps chromium

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone && touch ~/.config/rclone/rclone.conf

      - name: Test MEGA login (shows the real rclone error)
        continue-on-error: true
        env:
          RCLONE_CONFIG_MEGA_TYPE: mega
          RCLONE_CONFIG_MEGA_USER: ${{ secrets.MEGA_USER }}
          RCLONE_CONFIG_MEGA_PASS: ${{ secrets.MEGA_PASS }}
        run: |
          echo "MEGA_USER secret set: $([ -n "$RCLONE_CONFIG_MEGA_USER" ] && echo yes || echo NO)"
          echo "MEGA_PASS secret set: $([ -n "$RCLONE_CONFIG_MEGA_PASS" ] && echo yes || echo NO)"
          rclone lsd mega: -v 2>&1 | tail -30

      - name: Run scraper
        env:
          MAIN_URL: ${{ inputs.main_url }}
          MAX_LINKS: ${{ inputs.max_links }}
          RCLONE_LOG_LEVEL: ERROR
          PYTHONUNBUFFERED: "1"      # print logs live while scraping
          MEGA_USER: ${{ secrets.MEGA_USER }}
          MEGA_PASS: ${{ secrets.MEGA_PASS }}   # the OBSCURED password
        run: python scraper.py

      - name: Keep a copy of the results on GitHub too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipes-output
          path: |
            recipes.xlsx
            images/
          if-no-files-found: ignore
